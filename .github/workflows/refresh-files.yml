name: 자료 파일 목록 자동 갱신

# 매일 새벽 3시(KST, =UTC 18:00) 자동 실행 + 수동 실행 버튼
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 폴더별 파일 목록 수확 (공개 링크)
        run: node tools/harvest-files.mjs --force

      - name: 변경 있으면 커밋·푸시
        run: |
          if [ -n "$(git status --porcelain data-files.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data-files.js
            git commit -m "자동 갱신: 자료 파일 목록(data-files.js)"
            git push
            echo "data-files.js 갱신 완료"
          else
            echo "변경 없음 — 커밋 생략"
          fi
